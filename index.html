<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Digital Bouncer</title>
    <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.0/build/snarkjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 500px; width: 100%; border: 1px solid #334155; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #10b981; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        button { background: #059669; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 1rem; }
        button:hover { background: #047857; }
        .console { background: #020617; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 1.5rem; border: 1px solid #1e293b; min-height: 120px; overflow-y: auto; max-height: 250px; }
        .success { color: #4ade80; }
        .fail { color: #f87171; }
        .info { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔒 Enterprise ZKP Gateway</h1>
        <p>This verifies your identity using <strong>Groth16 zk-SNARKs</strong>. A dynamic challenge prevents replay attacks. No personal data ever leaves this device.</p>
        <button id="verifyBtn" onclick="executeZKP()">Prove Humanity</button>
        <div class="console" id="outputLog">System Ready.</div>
    </div>

    <script>
        const log = (msg, type='info') => {
            const el = document.getElementById('outputLog');
            el.innerHTML += `<span class="${type}">${msg}</span><br>`;
            el.scrollTop = el.scrollHeight;
        };

        async function executeZKP() {
            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('outputLog').innerHTML = '';
           
            try {
                // 1. Fetch Dynamic Challenge
                log("[1/3] Requesting secure challenge from server...", "info");
                const challengeRes = await fetch('/api/challenge');
                const { challenge } = await challengeRes.json();
                log(`Challenge Acquired: ${challenge}`, "success");

                // 2. Compute zk-SNARK Proof Locally
                log("\n[2/3] Computing zk-SNARK polynomials locally (WebAssembly)...", "info");
               
                // We simulate the private enclave key (in reality, pulled from NFC or Secure Enclave)
                const privateEnclaveKey = "999888777666";

                // snarkjs computes the proof using the .wasm and .zkey files
                const { proof, publicSignals } = await snarkjs.groth16.fullProve(
                    { privateEnclaveKey: privateEnclaveKey, publicChallenge: challenge },
                    "human_verifier.wasm",
                    "circuit_final.zkey"
                );

                log(`Proof Generated! πA: ${proof.pi_a[0].substring(0, 15)}...`, "success");

                // 3. Submit Proof to Server
                log("\n[3/3] Submitting mathematical proof to gateway...", "info");
                const verifyRes = await fetch('/api/verify-human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proof, publicSignals })
                });

                const data = await verifyRes.json();

                if (verifyRes.ok) {
                    log(`\n[ACCESS GRANTED] ${data.message}`, "success");
                } else {
                    log(`\n[ACCESS DENIED] ${data.message}`, "fail");
                }

            } catch (error) {
                console.error(error);
                log("\n[ERROR] Cryptographic computation or network failure.", "fail");
            } finally {
                document.getElementById('verifyBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
