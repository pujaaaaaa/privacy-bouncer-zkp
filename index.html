<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True ZKP Digital Bouncer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); max-width: 500px; width: 100%; border: 1px solid #334155; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #a855f7; display: flex; align-items: center; gap: 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        button { background: #9333ea; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 1rem; }
        button:hover { background: #7e22ce; }
        .console { background: #020617; padding: 1rem; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; margin-top: 1.5rem; border: 1px solid #1e293b; min-height: 120px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; max-height: 200px; }
        .status-success { color: #4ade80; }
        .status-fail { color: #f87171; }
        .math-text { color: #fcd34d; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⬡ True zk-SNARK Verifier</h1>
        <p>This UI simulates a <strong>Groth16 zk-SNARK</strong>. Instead of hashing, your device calculates complex polynomials to prove possession of a private hardware key, generating points on an elliptic curve.</p>
       
        <button onclick="generateAndVerifyZKP()">Generate Polynomial Proof</button>
       
        <div class="console" id="outputLog">System Idle. Awaiting circuit compilation...</div>
    </div>

    <script>
        // Simulating the time it takes a mobile device to calculate ZKP polynomials
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function generateAndVerifyZKP() {
            const log = document.getElementById('outputLog');
            log.innerHTML = "Loading WebAssembly circuit (age_verifier.wasm)...\n";
            await sleep(600);
           
            log.innerHTML += "Executing witness calculation (finding valid polynomial roots)...\n";
            await sleep(800);
           
            // This is the EXACT JSON structure generated by SnarkJS in production
            const snarkProof = {
                protocol: "groth16",
                curve: "bn128",
                pi_a: ["0x184c2e...", "0x20f3a..."],
                pi_b: [["0x1d9b...", "0x2ef1..."], ["0x0a1b...", "0x11c2..."]],
                pi_c: ["0x25bb...", "0x192a..."]
            };
           
            // The "1" represents the boolean output of our mathematical circuit (True = Human)
            const publicSignals = ["1"];

            log.innerHTML += `\n<span class="math-text">Proof Generated!</span> \nπA: ${snarkProof.pi_a[0].substring(0,8)}...\nπB: ${snarkProof.pi_b[0][0].substring(0,8)}...\n`;
            log.innerHTML += `Transmitting to Verifier Node...\n\n`;
            await sleep(500);

            try {
                const response = await fetch('/api/verify-human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proof: snarkProof, publicSignals: publicSignals })
                });

                const data = await response.json();

                if (response.ok) {
                    log.innerHTML += `<span class="status-success">[PAIRING SUCCESS]</span>\n${data.message}`;
                } else {
                    log.innerHTML += `<span class="status-fail">[REJECTED]</span>\n${data.message}`;
                }
            } catch (err) {
                log.innerHTML += `<span class="status-fail">[ERROR]</span> Could not reach backend server.`;
            }
        }
    </script>
</body>
</html>
